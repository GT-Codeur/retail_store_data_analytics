[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail_store_data_analytics"
version = "0.1.0"
description = "Airflow-driven ETL pipeline for retail store sales data."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "pandas>=1.5",
  "sqlalchemy>=1.4",
  "apache-airflow>=3.3.1",
  "python-dotenv==1.2.2",
  "psycopg2-binary>=2.9; platform_system!='Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "black>=24.0",
  "isort>=5.12",
  "flake8>=6.0",
  "python-dotenv==1.2.2",
  "psycopg==3.3.4"
]
